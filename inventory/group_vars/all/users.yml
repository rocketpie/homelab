# No SSH private key material lives in the repository.
# The active environment publishes its public key to run.ps1, which injects it as ansible_admin_ssh_public_key.

shared_admin_users:
  - name: ansible
    gecos: "Ansible Automation"
    groups:
      - adm
      - sudo
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "{{ ansible_admin_ssh_public_key }}"
