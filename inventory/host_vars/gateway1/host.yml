ansible_user: root
add_firewall_ssh_port: 22

# Host-local inbound exposure. Keep in sync with the Caddy listeners.
add_firewall_allowed_tcp_ports:
  - 80
  - 443
add_firewall_allowed_udp_ports:
  - 443

add_caddy_acme_email: "lars@co3d.eu"
add_caddy_routes:
  - hostnames:
      - "co3d.eu"
    upstream: "website:80"
  - hostnames:
      - "lobby.co3d.eu"
    upstream: "lobby:8080"

add_website_services:
  - website
  - lobby

# Preserve the CI publish key across playbook runs. Rotate it deliberately.
add_website_publish_key_rotate: false
