---
add_ansible_execution_packages:
  - ca-certificates
  - git
  - nodejs
  - openssh-client

add_ansible_execution_install_powershell: true
add_ansible_execution_install_docker: true
add_ansible_execution_devcontainer_cli_package: "@devcontainers/cli"

# The devcontainer CLI needs Node 20 or newer; Ubuntu 24.04 ships Node 18.
add_ansible_execution_node_repo_url: https://deb.nodesource.com
add_ansible_execution_node_major_version: "22"
add_ansible_execution_node_keyring_path: /etc/apt/keyrings/nodesource.asc

add_ansible_execution_repo_owner: "{{ ansible_user }}"
add_ansible_execution_repo_group: "{{ add_ansible_execution_repo_owner }}"
add_ansible_execution_repo_dir_name: homelab
add_ansible_execution_repo_url: "https://github.com/rocketpie/homelab.git"
add_ansible_execution_repo_version: main

add_ansible_execution_autoinstall_server_script: >-
  srv/Start-AutoInstallServer-{{ inventory_hostname }}.sh
