---
- name: Validate ansible execution inputs
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['os_family'] == 'Debian'
      - add_ansible_execution_repo_owner | string | trim | length > 0
      - add_ansible_execution_repo_dir_name | string | trim | length > 0
      - add_ansible_execution_repo_url | string | trim | length > 0
    fail_msg: >-
      add_ansible_execution requires a Debian-family Linux host, a repo owner,
      and a repo source.

- name: Check whether ansible execution repo owner exists
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ add_ansible_execution_repo_owner }}"
  register: add_ansible_execution_repo_owner_getent_result
  changed_when: false

- name: Assert ansible execution repo owner exists
  ansible.builtin.assert:
    that:
      - add_ansible_execution_repo_owner_getent_result.rc == 0
      - >-
        add_ansible_execution_repo_owner_getent_result.stdout
        | string
        | trim
        | length > 0
    fail_msg: >-
      add_ansible_execution_repo_owner {{ add_ansible_execution_repo_owner }}
      does not exist on the target host.

- name: Materialize ansible execution paths
  ansible.builtin.set_fact:
    add_ansible_execution_repo_owner_home: >-
      {{
        add_ansible_execution_repo_owner_getent_result.stdout.split(':')[5] | trim
      }}
    add_ansible_execution_repo_dir: >-
      {{
        (
          add_ansible_execution_repo_owner_getent_result.stdout.split(':')[5]
          | trim
        )
        ~ '/'
        ~ add_ansible_execution_repo_dir_name
      }}

- name: Ensure ansible execution repo owner home was resolved
  ansible.builtin.assert:
    that:
      - add_ansible_execution_repo_owner_home | string | trim | length > 0
      - add_ansible_execution_repo_owner_home.startswith('/')
    fail_msg: >-
      Could not determine a usable home directory for
      add_ansible_execution_repo_owner {{ add_ansible_execution_repo_owner }}.

- name: Materialize ansible execution Docker users
  ansible.builtin.set_fact:
    add_ansible_execution_docker_users: >-
      {{
        [add_ansible_execution_repo_owner]
        + (
            [add_admin_scripts_user]
            if (add_admin_scripts_user | default('', true) | string | trim | length > 0)
            else []
          )
      }}

- name: Install Docker for the dev container runtime
  ansible.builtin.include_role:
    name: add_docker
  vars:
    add_docker_users: "{{ add_ansible_execution_docker_users }}"
  when: add_ansible_execution_install_docker | bool

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add NodeSource repo GPG key
  ansible.builtin.get_url:
    url: "{{ add_ansible_execution_node_repo_url }}/gpgkey/nodesource-repo.gpg.key"
    dest: "{{ add_ansible_execution_node_keyring_path }}"
    mode: "0644"

- name: Add NodeSource apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ add_ansible_execution_node_keyring_path }}]
      {{ add_ansible_execution_node_repo_url }}/node_{{ add_ansible_execution_node_major_version }}.x
      nodistro main
    filename: nodesource
    state: present

- name: Add Microsoft repo GPG key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"
  when: add_ansible_execution_install_powershell | bool

- name: Add Microsoft apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc]
      https://packages.microsoft.com/ubuntu/{{ ansible_facts['distribution_version'] }}/prod
      {{ ansible_facts['distribution_release'] }} main
    filename: microsoft-prod
    state: present
  when: add_ansible_execution_install_powershell | bool

- name: Install ansible execution packages
  ansible.builtin.apt:
    name: >-
      {{
        add_ansible_execution_packages
        + (
            ['powershell']
            if (add_ansible_execution_install_powershell | bool)
            else []
          )
      }}
    state: present
    update_cache: true

- name: Install devcontainer CLI
  community.general.npm:
    name: "{{ add_ansible_execution_devcontainer_cli_package }}"
    global: true
    state: present

- name: Ensure ansible execution repo exists
  ansible.builtin.git:
    repo: "{{ add_ansible_execution_repo_url }}"
    dest: "{{ add_ansible_execution_repo_dir }}"
    version: "{{ add_ansible_execution_repo_version }}"
    single_branch: true
    update: true
  become: true
  become_user: "{{ add_ansible_execution_repo_owner }}"
  environment:
    HOME: "{{ add_ansible_execution_repo_owner_home }}"

- name: Ensure ansible execution repo ownership is correct
  ansible.builtin.file:
    path: "{{ add_ansible_execution_repo_dir }}"
    state: directory
    owner: "{{ add_ansible_execution_repo_owner }}"
    group: "{{ add_ansible_execution_repo_group }}"
    recurse: true

- name: Check whether host autoinstall server launcher exists
  ansible.builtin.stat:
    path: >-
      {{
        add_ansible_execution_repo_dir
        ~ '/'
        ~ add_ansible_execution_autoinstall_server_script
      }}
  register: add_ansible_execution_autoinstall_server_script_stat

- name: Materialize ansible execution admin helper scripts
  ansible.builtin.set_fact:
    add_ansible_execution_admin_scripts_extra_scripts: >-
      {{
        [
          {
            'name': 'homelab-run',
            'content': '#!/usr/bin/env bash\nset -euo pipefail\ncd '
              ~ (add_ansible_execution_repo_dir | quote)
              ~ '\ndevcontainer up --workspace-folder . >/dev/null && '
              ~ 'devcontainer exec --workspace-folder . -- '
              ~ 'pwsh ./run.ps1 "$@"\n'
          },
          {
            'name': 'homelab-lint',
            'content': '#!/usr/bin/env bash\nset -euo pipefail\ncd '
              ~ (add_ansible_execution_repo_dir | quote)
              ~ '\ndevcontainer up --workspace-folder . >/dev/null && '
              ~ 'devcontainer exec --workspace-folder . -- '
              ~ 'pwsh ./build.ps1 "$@"\n'
          },
          {
            'name': 'homelab-init-vaults',
            'content': '#!/usr/bin/env bash\nset -euo pipefail\ncd '
              ~ (add_ansible_execution_repo_dir | quote)
              ~ '\ndevcontainer up --workspace-folder . >/dev/null && '
              ~ 'devcontainer exec --workspace-folder . -- '
              ~ 'pwsh ./srv/Initialize-VaultTemplates.ps1 -RepoRoot . "$@"\n'
          }
        ]
        + (
            [
              {
                'name': 'homelab-autoinstall-seed',
                'content': '#!/usr/bin/env bash\nset -euo pipefail\ncd '
                  ~ (add_ansible_execution_repo_dir | quote)
                  ~ '\nexec ./'
                  ~ add_ansible_execution_autoinstall_server_script
                  ~ ' "$@"\n'
              }
            ]
            if (add_ansible_execution_autoinstall_server_script_stat.stat.exists | default(false))
            else []
          )
      }}

- name: Show environment store bootstrap instructions
  ansible.builtin.debug:
    msg:
      - "Next steps on {{ inventory_hostname }}:"
      - "1. Copy ~/.homelab/environments/<name> from the container host to {{ add_ansible_execution_repo_owner_home }}/.homelab/environments/<name>."
      - "2. Run: pwsh {{ add_ansible_execution_repo_dir }}/Set-Environment.ps1 -Environment <name>"
      - "3. Log out and back in so the docker group applies to {{ add_ansible_execution_repo_owner }}."
      - "4. Run: homelab-run -Help (the first run builds the dev container image)"
      - >-
        This VM is a trusted execution host: the copied environment store
        contains that environment's SSH private key.
