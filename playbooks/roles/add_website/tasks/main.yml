---
- name: Validate website inputs
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['distribution'] == 'Ubuntu'
      - add_website_services is sequence
      - add_website_services is not string
      - add_website_services | length > 0
      - add_website_services | unique | length == add_website_services | length
      - add_website_services | difference(add_website_supported_services) | length == 0
      - add_website_image_prefix | string | trim | length > 0
    fail_msg: >-
      add_website requires an Ubuntu host, a non-empty add_website_services
      list, no duplicates, and only supported services: website, lobby.

- name: Check Docker Compose availability
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false

- name: Install public workload packages
  ansible.builtin.apt:
    name: "{{ add_website_packages }}"
    state: present
    update_cache: true

- name: Create the public workload publish user
  ansible.builtin.user:
    name: "{{ add_website_publish_user }}"
    home: "/home/{{ add_website_publish_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present
  when: add_website_publish_enabled | bool

- name: Inspect the public workload publish key
  ansible.builtin.stat:
    path: "{{ add_website_publish_key_path }}"
  register: add_website_publish_key
  when: add_website_publish_enabled | bool

- name: Remove the previous public workload publish key pair
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ add_website_publish_key_path }}"
    - "{{ add_website_publish_key_path }}.pub"
  when:
    - add_website_publish_enabled | bool
    - >-
      (add_website_publish_key_rotate | bool)
      or not (add_website_publish_key.stat.exists | default(false))

- name: Generate the public workload publish key pair
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ add_website_publish_user }}@{{ inventory_hostname }}"
      - -f
      - "{{ add_website_publish_key_path }}"
  changed_when: true
  when:
    - add_website_publish_enabled | bool
    - >-
      (add_website_publish_key_rotate | bool)
      or not (add_website_publish_key.stat.exists | default(false))

- name: Set public workload publish key permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ add_website_publish_key_path }}"
      mode: "0600"
    - path: "{{ add_website_publish_key_path }}.pub"
      mode: "0644"
  loop_control:
    label: "{{ item.path }}"
  when: add_website_publish_enabled | bool

- name: Read the public workload publish public key
  ansible.builtin.slurp:
    src: "{{ add_website_publish_key_path }}.pub"
  register: add_website_publish_public_key
  when: add_website_publish_enabled | bool

- name: Authorize the public workload publish public key
  ansible.posix.authorized_key:
    user: "{{ add_website_publish_user }}"
    key: "{{ add_website_publish_public_key.content | b64decode }}"
    exclusive: true
    state: present
  when: add_website_publish_enabled | bool

- name: Install public workload publish instructions
  ansible.builtin.template:
    src: website-publish-README.md.j2
    dest: "{{ add_website_readme_path }}"
    owner: root
    group: root
    mode: "0644"
  when: add_website_publish_enabled | bool

- name: Ensure public workload project directory exists
  ansible.builtin.file:
    path: "{{ add_website_project_dir }}"
    state: directory
    owner: "{{ add_website_owner }}"
    group: "{{ add_website_group }}"
    mode: "0755"

- name: Ensure public workload artifact and trigger directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ add_website_artifact_owner }}"
    group: "{{ add_website_artifact_group }}"
    mode: "0755"
  loop: >-
    {{
      add_website_services
      | map('regex_replace', '^', add_website_project_dir ~ '/')
      | list
      + [add_website_trigger_dir]
    }}
  loop_control:
    label: "{{ item }}"

- name: Ensure the public deploy log exists
  ansible.builtin.file:
    path: "{{ add_website_log_file }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
  changed_when: false

- name: Inspect the shared reverse-proxy network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ add_website_proxy_network_name }}"
  register: add_website_proxy_network
  changed_when: false
  failed_when: false

- name: Create the shared reverse-proxy network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - "{{ add_website_proxy_network_name }}"
  when: add_website_proxy_network.rc != 0
  changed_when: true

- name: Render public workload Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ add_website_compose_file }}"
    owner: "{{ add_website_owner }}"
    group: "{{ add_website_group }}"
    mode: "0640"

- name: Install the public deploy script
  ansible.builtin.template:
    src: public-deploy.sh.j2
    dest: "{{ add_website_deploy_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the public deploy cron entry
  ansible.builtin.template:
    src: public-deploy.cron.j2
    dest: "{{ add_website_cron_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the public deploy logrotate configuration
  ansible.builtin.template:
    src: public-deploy.logrotate.j2
    dest: "{{ add_website_logrotate_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Inspect available public workload images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ add_website_image_prefix }}/{{ item }}:latest"
  loop: "{{ add_website_services }}"
  register: add_website_image_inspect
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item }}"

- name: Apply compose changes when every selected image is already loaded
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - --detach
      - --no-build
    chdir: "{{ add_website_project_dir }}"
  register: add_website_compose_up
  changed_when: >-
    (
      (add_website_compose_up.stdout | default(''))
      ~ (add_website_compose_up.stderr | default(''))
    ) is search('(Created|Started|Recreated|Pulled)')
  when: >-
    (
      add_website_image_inspect.results
      | selectattr('rc', 'equalto', 0)
      | list
      | length
    ) == (add_website_services | length)

- name: Show public workload container status
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
    chdir: "{{ add_website_project_dir }}"
  register: add_website_compose_ps
  changed_when: false

- name: Display public workload container status
  ansible.builtin.debug:
    msg: "{{ add_website_compose_ps.stdout_lines }}"
