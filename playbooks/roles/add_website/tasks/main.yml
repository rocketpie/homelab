---
- name: Validate website inputs
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['distribution'] == 'Ubuntu'
      - add_website_domain | string | trim | length > 0
      - >-
        (add_website_publish_port | string | trim | length == 0)
        or (add_website_publish_port | int > 0)
      - >-
        (add_website_publish_port | string | trim | length == 0)
        or (add_website_publish_port | int < 65536)
      - >-
        (add_website_publish_port | string | trim | length == 0)
        or (add_website_publish_bind | string | trim | length > 0)
      - >-
        (add_website_join_proxy_network | bool)
        or (add_website_publish_port | string | trim | length > 0)
    fail_msg: >-
      add_website requires an Ubuntu host and a domain. A website host that is
      not on the gateway must publish a host port for the gateway proxy, and a
      published port needs a bind address that exists on the website host.

- name: Check Docker Compose availability
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false

- name: Install website publishing packages
  ansible.builtin.apt:
    name: "{{ add_website_publish_packages }}"
    state: present
    update_cache: true
  when: add_website_publish_user | string | trim | length > 0

- name: Create the website publish user
  ansible.builtin.user:
    name: "{{ add_website_publish_user }}"
    home: "/home/{{ add_website_publish_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present
  when: add_website_publish_user | string | trim | length > 0

- name: Inspect the website publish key
  ansible.builtin.stat:
    path: "{{ add_website_publish_key_path }}"
  register: add_website_publish_key
  when: add_website_publish_user | string | trim | length > 0

- name: Remove the previous website publish key pair
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ add_website_publish_key_path }}"
    - "{{ add_website_publish_key_path }}.pub"
  when:
    - add_website_publish_user | string | trim | length > 0
    - >-
      (add_website_publish_key_rotate | bool)
      or not (add_website_publish_key.stat.exists | default(false))

- name: Generate the website publish key pair
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ add_website_publish_user }}@{{ inventory_hostname }}"
      - -f
      - "{{ add_website_publish_key_path }}"
  changed_when: true
  when:
    - add_website_publish_user | string | trim | length > 0
    - >-
      (add_website_publish_key_rotate | bool)
      or not (add_website_publish_key.stat.exists | default(false))

- name: Set website publish key permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ add_website_publish_key_path }}"
      mode: "0600"
    - path: "{{ add_website_publish_key_path }}.pub"
      mode: "0644"
  loop_control:
    label: "{{ item.path }}"
  when: add_website_publish_user | string | trim | length > 0

- name: Read the website publish public key
  ansible.builtin.slurp:
    src: "{{ add_website_publish_key_path }}.pub"
  register: add_website_publish_public_key
  when: add_website_publish_user | string | trim | length > 0

- name: Authorize the website publish public key
  ansible.posix.authorized_key:
    user: "{{ add_website_publish_user }}"
    key: "{{ add_website_publish_public_key.content | b64decode }}"
    exclusive: true
    state: present
  when: add_website_publish_user | string | trim | length > 0

- name: Install website publish instructions
  ansible.builtin.template:
    src: website-publish-README.md.j2
    dest: "{{ add_website_publish_readme_path }}"
    owner: root
    group: root
    mode: "0644"
  when: add_website_publish_user | string | trim | length > 0

- name: Ensure website project directory exists
  ansible.builtin.file:
    path: "{{ add_website_project_dir }}"
    state: directory
    owner: "{{ add_website_owner }}"
    group: "{{ add_website_group }}"
    mode: "0755"

- name: Ensure website content directory exists
  ansible.builtin.file:
    path: "{{ add_website_content_dir }}"
    state: directory
    owner: "{{ add_website_content_owner }}"
    group: "{{ add_website_content_group }}"
    mode: "0755"

- name: Inspect the shared reverse-proxy network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ add_website_proxy_network_name }}"
  register: add_website_proxy_network
  changed_when: false
  failed_when: false
  when: add_website_join_proxy_network | bool

- name: Create the shared reverse-proxy network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - "{{ add_website_proxy_network_name }}"
  when:
    - add_website_join_proxy_network | bool
    - add_website_proxy_network is defined
    - add_website_proxy_network.rc != 0
  changed_when: true

- name: Install placeholder website page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ add_website_content_dir }}/index.html"
    owner: "{{ add_website_content_owner }}"
    group: "{{ add_website_content_group }}"
    mode: "0644"
    force: false
  when: add_website_placeholder_enabled | bool

- name: Render website Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ add_website_compose_file }}"
    owner: "{{ add_website_owner }}"
    group: "{{ add_website_group }}"
    mode: "0640"

- name: Pull website container image
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - pull
    chdir: "{{ add_website_project_dir }}"
  changed_when: false
  when: add_website_pull_images | bool

- name: Deploy website container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - --detach
      - --remove-orphans
    chdir: "{{ add_website_project_dir }}"
  register: add_website_compose_up
  changed_when: >-
    (
      (add_website_compose_up.stdout | default(''))
      ~ (add_website_compose_up.stderr | default(''))
    ) is search('(Created|Started|Recreated|Pulled)')

- name: Show website container status
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
    chdir: "{{ add_website_project_dir }}"
  register: add_website_compose_ps
  changed_when: false

- name: Display website container status
  ansible.builtin.debug:
    msg: "{{ add_website_compose_ps.stdout_lines }}"
