---
- name: Install PowerShell (pwsh) on Ubuntu/Debian
  hosts: vm
  become: true
  tasks:
    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add Microsoft repo GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"

    - name: Remove legacy Microsoft apt list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/microsoft-prod.list
        state: absent

    - name: Add Microsoft apt repo
      ansible.builtin.deb822_repository:
        name: microsoft-prod
        types:
          - deb
        uris:
          - "https://packages.microsoft.com/ubuntu/{{ ansible_facts['distribution_version'] }}/prod"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - main
        architectures:
          - amd64
        signed_by: /etc/apt/keyrings/microsoft.asc
        install_python_debian: true
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install powershell
      ansible.builtin.apt:
        name: powershell
        state: present

    - name: Verify pwsh
      ansible.builtin.command: pwsh -v
      register: pwsh_ver
      changed_when: false

    - name: Print pwsh version
      ansible.builtin.debug:
        var: pwsh_ver.stdout
